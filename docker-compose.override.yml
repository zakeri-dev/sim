# Development overrides for docker-compose.local.yml
# This file will be automatically used by docker-compose
services:
  simstudio:
    environment:
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
    volumes:
      # Mount source code for live reload
      - ./apps/sim:/app/apps/sim
      - ./packages:/app/packages
      - ./package.json:/app/package.json
      - ./bun.lock:/app/bun.lock
      - ./turbo.json:/app/turbo.json
      # Exclude node_modules to use container's version
      - /app/node_modules
      - /app/apps/sim/node_modules
      - /app/apps/sim/.next
    # Override the production command with development command
    command: ["sh", "-c", "cd /app/apps/sim && bun run dev"]

  realtime:
    environment:
      - NODE_ENV=development
    volumes:
      # Mount source code for live reload
      - ./apps/sim:/app/apps/sim
      - ./packages:/app/packages
      - ./package.json:/app/package.json
      - ./bun.lock:/app/bun.lock
      # Exclude node_modules to use container's version
      - /app/node_modules
    # Override the production command with development command
    command: ["sh", "-c", "cd /app && bun run dev:sockets"]
